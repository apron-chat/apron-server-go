name: CI

on:
  # Branches with a pull request are covered by the pull_request run; pushing
  # to any branch as well ran every PR commit twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The push interop tests wait out the 30-second idle timeout (§4.5).
    timeout-minutes: 20
    steps:
      # The submodules hold the shared protocol fixtures from shazow/apron
      # (testdata/apron) and the web client the browser tests run
      # (.apron-web), each at its pinned commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            .apron-web/package-lock.json
            tests/interop/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make install
      - run: make check test build
      # Both Chromium builds: the headless shell for most tests, and full
      # Chromium (channel: 'chromium') for push.spec.ts, as the shell denies
      # notifications.
      - run: npx playwright install --with-deps chromium
        working-directory: tests/interop
      - run: make test-interop
      - run: make test-perf
